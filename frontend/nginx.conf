# ============================================================
#  nginx внутри контейнера frontend.
#  Отдаёт собранный SPA и проксирует API/загрузки на backend.
#
#  ВАЖНО: proxy_pass указывает на сервис из docker-compose
#  (http://backend:8080), а НЕ на localhost — внутри контейнера
#  localhost указывал бы на сам nginx.
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip для статики — заметно ускоряет первую загрузку.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA-fallback: любой маршрут отдаёт index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты Vite можно кэшировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Загруженные файлы → backend.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
