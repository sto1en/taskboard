server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/taskboard
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# срок истечения токена, после него нужно будет снова авторизоваться
# Секрет ОБЯЗАТЕЛЬНО переопределять через переменную окружения APP_JWT_SECRET в проде.
app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-32-bytes-long-for-hs256}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Папка для загрузок
app.upload.dir=${UPLOAD_DIR:uploads}
# Базовый URL для отдачи (фронт склеит)
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8082/uploads}
# Максимальный размер файла (5 МБ)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB