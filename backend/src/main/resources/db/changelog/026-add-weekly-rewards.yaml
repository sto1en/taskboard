databaseChangeLog:

  # ============================================================
  # 026 — Подарок недели
  #
  # weekly_reward_configs — расписание бесплатных скинов по неделям.
  #   • week_start — понедельник недели (нормализуется на бэкенде);
  #   • item_type — TREE | FRAME | AVATAR | ACCENT;
  #   • item_code — code предмета из соответствующего каталога;
  #   • enabled — можно выключить, не удаляя запись.
  #
  # user_weekly_rewards — факт получения подарка. Уникальная пара
  # (user_id, week_start) делает claim идемпотентным.
  # ============================================================
  - changeSet:
      id: 026-01-weekly-reward-configs
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: weekly_reward_configs }
      changes:
        - createTable:
            tableName: weekly_reward_configs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: week_start, type: DATE,         constraints: { nullable: false } }
              - column: { name: item_type,  type: VARCHAR(20),  constraints: { nullable: false } }
              - column: { name: item_code,  type: VARCHAR(64),  constraints: { nullable: false } }
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column: { name: created_at, type: TIMESTAMP,    constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: weekly_reward_configs
            columnNames: week_start
            constraintName: uq_weekly_reward_week

  - changeSet:
      id: 026-02-user-weekly-rewards
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: user_weekly_rewards }
      changes:
        - createTable:
            tableName: user_weekly_rewards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_user_weekly_rewards_user
              - column: { name: week_start, type: DATE,        constraints: { nullable: false } }
              - column: { name: item_type,  type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: item_code,  type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: claimed_at, type: TIMESTAMP,   constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: user_weekly_rewards
            columnNames: user_id, week_start
            constraintName: uq_user_weekly_rewards_week
