databaseChangeLog:

  # ============================================================
  # 025 — Инвентарь и тайники
  #
  # user_inventory — расходуемые предметы пользователя (например, ключи).
  # user_key_grants — журнал выдачи ключей за достигнутые milestone
  # (20, 40, 60... задач за локальный день). Уникальность по
  # (user_id, grant_date, milestone) не даёт начислить один и тот же ключ
  # повторно при повторных GET-запросах.
  # ============================================================
  - changeSet:
      id: 025-01-user-inventory
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: user_inventory }
      changes:
        - createTable:
            tableName: user_inventory
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_user_inventory_user
              - column: { name: item_code, type: VARCHAR(64), constraints: { nullable: false } }
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: user_inventory
            columnNames: user_id, item_code
            constraintName: uq_user_inventory_item

  - changeSet:
      id: 025-02-user-key-grants
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: user_key_grants }
      changes:
        - createTable:
            tableName: user_key_grants
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_user_key_grants_user
              - column: { name: grant_date, type: DATE,      constraints: { nullable: false } }
              - column: { name: milestone,  type: INT,       constraints: { nullable: false } }
              - column: { name: granted_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: user_key_grants
            columnNames: user_id, grant_date, milestone
            constraintName: uq_user_key_grants_day_milestone
