databaseChangeLog:

  # ============================================================
  # 024 — Ежедневная цель и забранная награда
  #
  # Одна строка на пользователя и локальную дату. Наличие строки значит,
  # что награда за этот день уже начислена — повторный claim ничего не
  # добавляет, даже если задачи продолжают закрываться.
  # ============================================================
  - changeSet:
      id: 024-01-user-daily-rewards
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: user_daily_rewards }
      changes:
        - createTable:
            tableName: user_daily_rewards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_user_daily_rewards_user
              - column: { name: reward_date,    type: DATE,         constraints: { nullable: false } }
              - column: { name: tasks_done,     type: INT,          constraints: { nullable: false } }
              - column: { name: tier,           type: VARCHAR(20),  constraints: { nullable: false } }
              - column: { name: leaves_awarded, type: INT,          constraints: { nullable: false } }
              - column: { name: claimed_at,     type: TIMESTAMP,    constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: user_daily_rewards
            columnNames: user_id, reward_date
            constraintName: uq_user_daily_rewards_day
