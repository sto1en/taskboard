databaseChangeLog:

  # ============================================================
  # Магазин — акценты (цветовые схемы)
  # ============================================================

  - changeSet:
      id: 010-01-accent-skins
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: accent_skins }
      changes:
        - createTable:
            tableName: accent_skins
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: code,        type: VARCHAR(64),  constraints: { nullable: false, unique: true } }
              - column: { name: title,       type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: price,       type: INT,          constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: sort_order,  type: INT,          constraints: { nullable: false }, defaultValueNumeric: 0 }

  - changeSet:
      id: 010-02-user-accents
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: user_accents }
      changes:
        - createTable:
            tableName: user_accents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_user_accents_user
              - column:
                  name: accent_skin_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: accent_skins(id)
                    foreignKeyName: fk_user_accents_skin
              - column: { name: purchased_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: user_accents
            columnNames: user_id, accent_skin_id
            constraintName: uq_user_accents

  # ============================================================
  # Удалить рамку "Радуга"
  # ============================================================
  - changeSet:
      id: 010-03-remove-rainbow-frame
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - tableExists: { tableName: frames }
      changes:
        - sql:
            sql: "DELETE FROM user_frames WHERE frame_id IN (SELECT id FROM frames WHERE code = 'rainbow')"
        - sql:
            sql: "UPDATE user_appearance SET active_frame_id = NULL WHERE active_frame_id IN (SELECT id FROM frames WHERE code = 'rainbow')"
        - sql:
            sql: "DELETE FROM frames WHERE code = 'rainbow'"

  # ============================================================
  # Добавить 10 новых рамок
  # ============================================================
  - changeSet:
      id: 010-04-add-new-frames
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - tableExists: { tableName: frames }
      changes:
        - insert:
            tableName: frames
            columns:
              - column: { name: code, value: 'paper' }
              - column: { name: title, value: 'Бумага' }
              - column: { name: description, value: 'Тёплая бежевая рамка' }
              - column: { name: css_class, value: 'frame--paper' }
              - column: { name: price, valueNumeric: 15 }
              - column: { name: sort_order, valueNumeric: 110 }
        - insert:
            tableName: frames
            columns:
              - column: { name: code, value: 'carbon' }
              - column: { name: title, value: 'Карбон' }
              - column: { name: description, value: 'Чёрная текстура с блеском' }
              - column: { name: css_class, value: 'frame--carbon' }
              - column: { name: price, valueNumeric: 100 }
              - column: { name: sort_order, valueNumeric: 120 }
        - insert:
            tableName: frames
            columns:
              - column: { name: code, value: 'ice' }
