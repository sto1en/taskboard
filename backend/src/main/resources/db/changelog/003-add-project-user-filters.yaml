databaseChangeLog:
  - changeSet:
      id: 003-01-project-user-filters
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: project_user_filters }
      changes:
        - createTable:
            tableName: project_user_filters
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_puf_user
                    deleteCascade: true
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: projects(id)
                    foreignKeyName: fk_puf_project
                    deleteCascade: true
              - column:
                  name: status_ids
                  type: "BIGINT[]"
                  constraints:
                    nullable: false
              - column: { name: sort_mode, type: VARCHAR(32), constraints: { nullable: true } }
              - column: { name: sort_dir,  type: VARCHAR(8),  constraints: { nullable: true } }
              - column: { name: view_mode, type: VARCHAR(16), constraints: { nullable: true } }
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: project_user_filters
            columnNames: user_id, project_id
            constraintName: pk_project_user_filters
        - createIndex:
            tableName: project_user_filters
            indexName: idx_puf_user
            columns:
              - column: { name: user_id }