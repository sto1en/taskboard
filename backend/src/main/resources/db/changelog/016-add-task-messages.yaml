databaseChangeLog:
  - changeSet:
      id: 016-01-task-messages
      author: admin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: task_messages }
      changes:
        - createTable:
            tableName: task_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: tasks(id)
                    foreignKeyName: fk_task_messages_task
                    deleteCascade: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_task_messages_user
              - column: { name: text,       type: TEXT,      constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: edited_at,  type: TIMESTAMP, constraints: { nullable: true } }
        - createIndex:
            tableName: task_messages
            indexName: idx_task_messages_task
            columns:
              - column: { name: task_id }
              - column: { name: created_at }