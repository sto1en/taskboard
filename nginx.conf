# ============================================================
#  nginx для запуска БЕЗ Docker (приложение на самом сервере).
#  Пути D:/projects/... были локальными для Windows — здесь
#  они заменены на относительный root, который нужно
#  поправить под ваш сервер (см. комментарий ниже).
#
#  Если разворачиваете через docker compose, этот файл
#  не нужен: внутри контейнера работает frontend/nginx.conf,
#  который сам проксирует /api и /uploads на сервис backend.
# ============================================================
server {
    listen 80;
    server_name _;

    # Укажите путь к собранной статике (frontend/dist) на сервере.
    # Пример: /var/www/taskboard/frontend/dist
    root /var/www/taskboard/frontend/dist;
    index index.html;

    # SPA-fallback для react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (Spring Boot слушает 8082 при локальном запуске).
    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Загруженные файлы → backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8082/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
